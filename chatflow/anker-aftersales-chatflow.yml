app:
  description: Anker 售后排障与政策路由；检索、排障状态与工单由规则服务负责，无 Dify 知识库依赖。
  icon: 🤖
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: Anker 售后 AI 客服 · 无Embedding
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/minimax:0.0.27@ac743d9df8e7c785af361ad8427a6a119b2e590cd1528b4b5a20ea77b5e56f47
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables:
  - id: c1209cdd-cd48-5918-acad-2ef91b685b9b
    name: session_state
    value: '{}'
    value_type: string
    description: 每轮由规则服务返回并赋值，保存排障及模拟交接状态
    selector:
