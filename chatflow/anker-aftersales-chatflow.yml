            - 第 1 行：`__STATE__{''intent'':''complaint'',''emotion'':''{{#emotion_node.emotion_level#}}'',''emotion_intensity'':''{{#emotion_node.emotion_intensity#}}''}__STATE__`

            - 第 2 行起：先输出 1 句安抚（参考 empathy_responses.yaml），再输出业务逻辑


