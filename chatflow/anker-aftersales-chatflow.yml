    value: "{\n  \"product\": \"Soundcore 耳机\",\n  \"issue\": \"one_side_silent\",\n  \"entry\": \"n1\",\n  \"nodes\": {\n    \"n1\": {\n      \"ask\": \"请问是单边没声音，还是两边都连不上/没声音？\",\n      \"branches\": { \"one_side\": \"n2\", \"both\": \"n5\", \"pairing\": \"n6\" }\n    },\n    \"n2\": {\n      \"ask\": \"先做个快速检查：耳机触点上的保护膜撕掉了吗？放回充电盒时能看到充电指示吗？\",\n      \"vision_skip\": true,\n      \"branches\": { \"film_removed_charging\": \"n3\", \"film_or_no_charge\": \"c_film_charge\", \"unclear\": \"n3\" }\n    },\n    \"n3\": {\n      \"ask\": \"用酒精棉签清洁一下出声孔的金属网（耳帽下面），再换一个稍大的耳帽试试，有改善吗？\",\n      \"branches\": { \"yes\": \"c_resolved\", \"no\": \"n4\" }\n    },\n    \"n4\": {\n      \"ask\": \"检查下手机的音量平衡设置（iPhone：设置-辅助功能-音频/视觉-平衡；安卓类似），是居中的吗？\",\n      \"branches\": { \"centered\": \"n7\", \"adjusted_fixed\": \"c_resolved\" }\n    },\n    \"n5\": {\n      \"ask\": \"耳机放回充电盒充 1 小时后取出，有反应吗？\",\n      \"branches\": { \"works\": \"c_resolved\", \"no\": \"n7\" }\n    },\n    \"n6\": {\n      \"ask\": \"请在手机蓝牙里删除配对记录并关闭蓝牙，然后重置耳机（放入盒中开盖，长按盒上按键 10 秒），再重新配对。成功了吗？\",\n      \"branches\": { \"yes\": \"c_resolved\", \"no\": \"n7\" }\n    },\n    \"n7\": {\n      \"ask\": \"最后一步：换另一台手机/设备连接试试，问题还在吗？\",\n      \"branches\": { \"follows_device\": \"c_hw_fault\", \"device_specific\": \"c_device_issue\" }\n    }\n  },\n  \"conclusions\": {\n    \"c_film_charge\": { \"action\": \"rag_answer\", \"solution\": \"撕膜+充电 1 小时（官方 S2）\", \"fault_type\": \"contact_or_power\" },\n    \"c_resolved\": { \"action\": \"close_ticket\", \"solution\": \"已解决，建议观察\", \"fault_type\": \"resolved\" },\n    \"c_device_issue\": { \"action\": \"rag_answer\", \"solution\": \"问题出在设备端，非耳机故障\", \"fault_type\": \"device_side\" },\n    \"c_hw_fault\": { \"action\": \"check_warranty\", \"solution\": \"交叉验证后仍异常，疑似硬件故障，进入保修核验\", \"fault_type\": \"earbud_hw_fault\" }\n  }\n}\n"
