      data:
        type: code
        title: 情绪识别
        desc: 确定性关键词情绪识别（V4.2 P1 升级）
        code: "def main(query: str, emotion_history: str = '') -> dict:\n    \"\"\"情绪识别 + 多轮累积 + 强度分级\"\"\"\n    import json\n    q = query.strip()\n    history = []\n    if emotion_history:\n        try:\n            history = json.loads(emotion_history)\n            if not isinstance(history, list):\n                history = []\n        except (json.JSONDecodeError, TypeError):\n            history = []\n\n    complaint_kw = ['315', '工商', '起诉', '曝光', '12315', '律师', '差评', '黑猫', '消协', '媒体', '打官司', '维权', '法院']\n    angry_kw = ['气死', '太过分', '忍无可忍', '气炸', '无良', '骗子', '垃圾', '受不了', '救命', '愤怒', '再也不买', '投诉你们']\n    angry_kw_with_companion = ['怒', '投诉']\n    upset_kw = ['失望', '不应该', '烦', '郁闷', '糟心', '恼火', '焦虑', '烦躁', '崩溃', '无助', '糟糕']\n    upset_kw_with_companion = ['不好']\n    urgent_kw = ['很急', '着急', '急死', '快急', '紧急', '帮帮我', '怎么办']\n    broken_kw = ['完全不工作', '彻底不工作', '坏了', '不工作了', '用不了', '不能用了', '罢工', '故障', '不行']\n    safety_kw = ['爆炸', '自燃', '烧了', '烫伤', '焦味', '冒烟', '起火', '漏液', '鼓包']\n\n    matched = []\n    for kw in complaint_kw:\n        if kw in q:\n            matched.append(('complaint', kw)); break\n    if not matched:\n        for kw in safety_kw:\n            if kw in q:\n                matched.append(('angry', kw)); break\n    if not matched:\n        for kw in angry_kw:\n            if kw in q:\n                matched.append(('angry', kw)); break\n    if not matched:\n        has_weak_angry = any(kw in q for kw in angry_kw_with_companion)\n        has_broken = any(kw in q for kw in broken_kw)\n        has_urgent = any(kw in q for kw in urgent_kw)\n        if has_weak_angry and (has_broken or has_urgent):\n            for kw in angry_kw_with_companion:\n                if kw in q:\n                    matched.append(('angry', kw + '+紧急')); break\n    if not matched:\n        has_broken = any(kw in q for kw in broken_kw)\n        has_urgent = any(kw in q for kw in urgent_kw)\n        if has_broken and has_urgent:\n            matched.append(('angry', '坏+急'))\n    if not matched:\n        for kw in upset_kw:\n            if kw in q:\n                matched.append(('upset', kw)); break\n    if not matched:\n        has_weak = any(kw in q for kw in upset_kw_with_companion)\n        has_broken = any(kw in q for kw in broken_kw)\n        has_urgent = any(kw in q for kw in urgent_kw)\n        if has_weak and (has_broken or has_urgent):\n            matched.append(('upset', '不好+紧急'))\n    if not matched:\n        has_broken = any(kw in q for kw in broken_kw)\n        has_urgent = any(kw in q for kw in urgent_kw)\n        if has_broken or has_urgent:\n            matched.append(('upset', '故障或紧急'))\n    if not matched:\n        matched.append(('normal', ''))\n\n    level, trigger = matched[0]\n    history.append({'level': level, 'trigger': trigger, 'query': q[:50]})\n    history = history[-5:]\n\n    intensity_map = {'normal': 'L0_none', 'upset': 'L1_mild', 'angry': 'L2_strong', 'complaint': 'L3_priority'}\n    consecutive_angry = 0\n    for h in reversed(history):\n        if h['level'] == 'angry':\n            consecutive_angry += 1\n        else:\n            break\n    if consecutive_angry >= 2:\n        trigger_with_note = f'{trigger} (连续{consecutive_angry}次暴怒)'\n        level_upgraded = 'angry_escalated'\n    else:\n        level_upgraded = level\n        trigger_with_note = trigger\n    intensity = intensity_map.get(level, 'L0_none')\n\n    return {\n        'emotion_level': level_upgraded,\n        'emotion_confidence': 0.95,\n        'emotion_trigger': trigger_with_note,\n        'emotion_intensity': intensity,\n        'emotion_history': json.dumps(history, ensure_ascii=False),\n        'emotion_text': json.dumps({\n            'level': level_upgraded, 'original_level': level, 'intensity': intensity,\n            'confidence': 0.95, 'keywords': [trigger] if trigger else [],\n            'trigger': trigger_with_note, 'consecutive_angry': consecutive_angry,\n            'history_size': len(history),\n        }, ensure_ascii=False)\n    }\n"
        code_language: python3
