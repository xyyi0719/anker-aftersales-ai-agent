        desc: 自动检测 query 中的订单号/政策词，调 mock-apis HTTP API，结果存到 env.tool_results
        code: "def main(query: str) -> dict:\n    \"\"\"V4.2 P0: S1 Pro 触发产品歧义，跳过所有工具调用\"\"\"\n    import json, urllib.request, urllib.error, re\n\n    # P0: S1 Pro 歧义前置判定（不让 policy_retrieve 误触）\n    if re.search(r\"S1\\s*Pro\", query, re.IGNORECASE):\n        return {\"tool_results\": json.dumps({\n            \"is_product_ambiguous\": True,\n            \"disambiguation_candidates\": [\"eufy 吸奶器 S1 Pro\", \"eufy RoboVac 扫地机器人 S1 Pro\"],\n            \"tools_called\": [],\n            \"results\": {}\n        }, ensure_ascii=False)}\n\n    results = {\"query\": query, \"tools_called\": [], \"results\": {}}\n\n    order_match = re.search(r'ANK-2024-\\d{3}', query)\n    if order_match:\n        order_id = order_match.group(0)\n        try:\n            req = urllib.request.Request(\n                'http://mock-apis:8002/api/orders/' + order_id,\n                method='POST',\n                headers={'Content-Type': 'application/json'},\n                data=json.dumps({\"order_id\": order_id}).encode()\n            )\n            with urllib.request.urlopen(req, timeout=10) as resp:\n                results[\"results\"][\"query_order\"] = json.loads(resp.read().decode())\n                results[\"tools_called\"].append(\"query_order\")\n        except Exception as e:\n            results[\"results\"][\"query_order\"] = {\"error\": str(e)}\n\n        try:\n            req = urllib.request.Request(\n                'http://mock-apis:8002/api/warranty/check',\n                method='POST',\n                headers={'Content-Type': 'application/json'},\n                data=json.dumps({\n                    \"order_id\": order_id,\n                    \"purchase_date\": \"2024-01-15\",\n                    \"product_model\": \"Anker 737\"\n                }).encode()\n            )\n            with urllib.request.urlopen(req, timeout=10) as resp:\n                results[\"results\"][\"check_warranty\"] = json.loads(resp.read().decode())\n                results[\"tools_called\"].append(\"check_warranty\")\n        except Exception as e:\n            results[\"results\"][\"check_warranty\"] = {\"error\": str(e)}\n\n    policy_keywords = [\"保修\", \"退换\", \"召回\", \"三包\", \"售后\", \"维修\", \"更换\"]\n    if any(kw in query for kw in policy_keywords):\n        try:\n            req = urllib.request.Request(\n                'http://mock-apis:8002/api/policy/retrieve',\n                method='POST',\n                headers={'Content-Type': 'application/json'},\n                data=json.dumps({\n                    \"query\": query,\n                    \"top_k\": 3,\n                    \"filters\": {}\n                }).encode()\n            )\n            with urllib.request.urlopen(req, timeout=10) as resp:\n                results[\"results\"][\"policy_retrieve\"] = json.loads(resp.read().decode())\n                results[\"tools_called\"].append(\"policy_retrieve\")\n        except Exception as e:\n            results[\"results\"][\"policy_retrieve\"] = {\"error\": str(e)}\n\n    return {\n        \"tool_results\": json.dumps(results, ensure_ascii=False)\n    }\n"
        code_language: python3
        outputs:
          tool_results:
            type: string
            children: null
        selected: false
        title: 工具预调度
        type: code
        variables:
