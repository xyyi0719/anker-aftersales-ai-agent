      data:
        desc: 意图分类 - Python 关键词匹配（确定性，给 LLM 提供 context 注入）
        title: 意图分类
        type: code
        code_language: python3
        code: "def main(query: str) -> dict:\n    \"\"\"V4.2 P0: 多轮对话支持 - S1 Pro 消歧 + 消歧回复识别\"\"\"\n    import re\n\n    q = query.strip()\n\n    # P0-2: S1 Pro 触发产品消歧（首次问）\n    if re.search(r'S1\\s*Pro', q, re.IGNORECASE):\n        return {'intent_id': 'transfer_human', 'intent_name': '产品歧义反问', 'matched_keyword': 'S1 Pro 歧义', 'confidence': 0.99}\n\n    # P0-2: 消歧回复识别 - 用户回复「扫地机器人」「吸奶器」「1」「2」等\n    # 这些是上一轮 S1 Pro 反问的延续，路由到 troubleshooting\n    disambig_reply_kw = ['扫地机器人', '吸奶器', '扫地机', 'breast pump', 'breastpump', 'robovac']\n    if q in ['1', '2', '一', '二', '扫地', '吸奶']:\n        return {'intent_id': 'troubleshooting', 'intent_name': '消歧后故障排查', 'matched_keyword': '消歧回复', 'confidence': 0.95}\n    if any(kw in q for kw in disambig_reply_kw) and len(q) <= 20:\n        return {'intent_id': 'troubleshooting', 'intent_name': '消歧后故障排查', 'matched_keyword': '消歧回复', 'confidence': 0.95}\n\n    \"\"\"V4.2 P0: 多轮对话支持 - S1 Pro 消歧 + 消歧回复识别\"\"\"\n    import re\n\n    q = query.strip()\n\n    # P0-2: S1 Pro 触发产品消歧（首次问）\n    if re.search(r'S1\\s*Pro', q, re.IGNORECASE):\n        return {'intent_id': 'transfer_human', 'intent_name': '产品歧义反问', 'matched_keyword': 'S1 Pro 歧义', 'confidence': 0.99}\n\n    # P0-2: 消歧回复识别 - 用户回复「扫地机器人」「吸奶器」「1」「2」等\n    # 这些是上一轮 S1 Pro 反问的延续，路由到 troubleshooting\n    disambig_reply_kw = ['扫地机器人', '吸奶器', '扫地机', 'breast pump', 'breastpump', 'robovac']\n    if q in ['1', '2', '一', '二', '扫地', '吸奶']:\n        return {'intent_id': 'troubleshooting', 'intent_name': '消歧后故障排查', 'matched_keyword': '消歧回复', 'confidence': 0.95}\n    if any(kw in q for kw in disambig_reply_kw) and len(q) <= 20:\n        return {'intent_id': 'troubleshooting', 'intent_name': '消歧后故障排查', 'matched_keyword': '消歧回复', 'confidence': 0.95}\n\n    \"\"\"V4.2 P0: S1 Pro 强制路由到 transfer_handler（在反问阶段）\"\"\"\n    import re\n    # P0: S1 Pro 触发 product_disambiguation，路由到 transfer_handler 反问\n    if re.search(r'S1\\s*Pro', query, re.IGNORECASE):\n        return {'intent_id': 'transfer_human', 'intent_name': '产品歧义反问', 'matched_keyword': 'S1 Pro 歧义', 'confidence': 0.99}\n    q = query.strip()\n    complaint_kw = ['315','工商','起诉','曝光','律师','维权','打官司','黑猫','12315','消协','媒体']\n    transfer_kw  = ['经理','人工','主管','老板','真人','领导','客服','找人']\n    return_kw    = ['退货','换货','退款','不要了','退掉','退一','换新','7天','七天']\n    trouble_kw   = ['不吸','鼓包','漏液','起火','冒烟','充不进','坏了','用不了','不动','不工作','故障','死机','掉电','接触不良','异响','发热','发烫','不亮','不响','不转','无法开机','开不了机','充电慢','无法充电','没反应','不识别']\n    inquiry_kw   = ['怎么','多久','什么时候','能否','可以','保修','教程','兼容','支持','什么是','区别','怎样','如何','配置','说明','说明书','能不能','在哪里','在哪','能用吗','召回','型号','多少钱','价格']\n    matched=None; intent_id='out_of_scope'; intent_name='兜底'\n    for kw in complaint_kw:\n        if kw in q: matched=kw; intent_id='complaint'; intent_name='投诉'; break\n    if not matched:\n        for kw in transfer_kw:\n            if kw in q: matched=kw; intent_id='transfer_human'; intent_name='转人工'; break\n    if not matched:\n        for kw in return_kw:\n            if kw in q: matched=kw; intent_id='return_or_exchange'; intent_name='退换'; break\n    if not matched:\n        for kw in trouble_kw:\n            if kw in q: matched=kw; intent_id='troubleshooting'; intent_name='故障报修'; break\n    if not matched:\n        for kw in inquiry_kw:\n            if kw in q: matched=kw; intent_id='inquiry'; intent_name='咨询'; break\n    return {'intent_id':intent_id,'intent_name':intent_name,'matched_keyword':matched or 'none','confidence':0.95 if matched else 0.50}\n"
        variables:
        - variable: query
          value_selector:
          - sys
          - query
          value_type: string
