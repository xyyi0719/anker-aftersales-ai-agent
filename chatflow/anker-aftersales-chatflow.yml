"port_hw_fault\" },\n    \"c_resolved\": { \"action\": \"close_ticket\", \"solution\": \"复位恢复，建议观察 48 小时\", \"fault_type\": \"resolved\" }\n  }\n}\n"
  - name: fault_tree_soundcore
