 \"any\", \"region\": \"CN\", \"category\": \"any\", \"condition\": \"non_cn_sold\" },\n      \"policy\": {\n        \"sop_branch\": \"REGION_LOCKED\",\n        \"return_rule\": \"非中国大陆销售的 Anker 产品不享受中国大陆三包服务\",\n        \"source\": \"Anker 中国保修文档例外条款\"\n      }\n    }\n  ],\n  \"fallback\": {\n    \"sop_branch\": \"ESCALATE\",\n    \"rule\": \"查不到匹配规则时，禁止推测政策，固定话术升级人工\",\n    \"message\": \"这个购买渠道/区域的售后政策我需要为您转接专员确认，绝不瞎猜。\"\n  }\n}\n"
