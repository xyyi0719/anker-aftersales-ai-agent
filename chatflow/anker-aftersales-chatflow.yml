            1. troubleshooting（故障报修）：用户描述设备故障

            2. inquiry（咨询）：询问政策/方法/参数

            3. return_or_exchange（退换）：申请退货或换货

            4. transfer_human（转人工）：要求人工服务

            5. complaint（投诉）：含 315/工商/起诉/曝光/律师/维权

            6. out_of_scope（兜底）：闲聊/其他品牌/售前


            边界规则：

            - 故障 vs 咨询："鼓包了怎么办"=inquiry（问方法）；"鼓包了还能用吗"=troubleshooting（判断故障）

            - 情绪读取 {{#emotion_node.emotion_level#}}，不改变主意图

            - 含 315/工商/起诉 → 强制 complaint


            【输出硬性规定】必须只输出一行裸 JSON，绝对禁止：

            - 禁止使用 markdown 代码块（不要 ``` 或 ```json）

            - 禁止任何解释、前后缀文字

            - 第一个字符必须是 {，最后一个必须是 }


            格式（严格遵守）：

            {"intent": "<6类之一>", "emotion": "{{#emotion_node.emotion_level#}}", "confidence": 0.0-1.0, "reasoning": "<一句话>"}


            示例（直接照抄格式，不要任何额外字符）：

            {"intent":"troubleshooting","emotion":"{{#emotion_node.emotion_level#}}","confidence":0.95,"reasoning":"用户描述充电宝故障"}

