app:
  description: Anker 售后排障与政策路由；检索、排障状态与工单由规则服务负责，无 Dify 知识库依赖。
  icon: 🤖
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: Anker 售后 · 无模型联调
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables:
  - id: c1209cdd-cd48-5918-acad-2ef91b685b9b
    name: session_state
    value: '{}'
    value_type: string
    description: 每轮由规则服务返回并赋值，保存排障及模拟交接状态
    selector:
    - conversation
    - session_state
  environment_variables:
  - id: 8051d946-e9db-59ce-befd-93a45169ed98
    name: MOCK_API_BASE_URL
    value: http://anker-demo-api:8002
    value_type: string
    description: 改为 Dify 服务器实际能访问的 Mock 地址；不要带末尾斜杠
    selector:
    - env
    - MOCK_API_BASE_URL
  - id: 88771512-64d1-5213-bf2a-61c2902a93bd
    name: MOCK_API_KEY
    value: ''
    value_type: secret
    description: 与服务器 .env 的 MOCK_API_KEY 一致
    selector:
    - env
    - MOCK_API_KEY
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 3
    opening_statement: 您好，我是 Anker 售后助手。说说遇到的问题就行，也可以直接发故障照片。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - Anker 737 充不进电
    - DEMO-US-001 保修多久
    - 这个型号有召回吗
    - 我的 S1 Pro 耳机有问题
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 用户输入
        desc: ''
        selected: false
        variables: []
    - id: extract
      type: custom
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 无模型占位（仅验证文字规则）
        desc: ''
        selected: false
        code_language: python3
        code: "def main() -> dict:\n    return {\"text\": \"{}\"}\n"
        variables: []
        outputs:
          text:
            type: string
            children: null
    - id: pack
      type: custom
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 安全编码请求 JSON
        desc: ''
        selected: false
        code_language: python3
        code: "import json\n\ndef main(query: str, state: str, extraction: str, conversation_id: str, files: list) -> dict:\n\
          \    def obj(s):\n        try:\n            v = json.loads(s.strip().removeprefix('```json').removeprefix('```').removesuffix('```').strip())\n\
          \            return v if isinstance(v, dict) else {}\n        except Exception:\n            return {}\n    data\
          \ = {\"query\": query, \"state\": obj(state), \"extraction\": obj(extraction),\n            \"conversation_id\"\
          : conversation_id, \"has_image\": bool(files)}\n    return {\"body\": json.dumps(data, ensure_ascii=False)}\n"
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        - variable: state
          value_selector:
          - conversation
          - session_state
        - variable: extraction
          value_selector:
          - extract
          - text
        - variable: conversation_id
          value_selector:
          - sys
          - conversation_id
        - variable: files
          value_selector:
          - sys
          - files
        outputs:
          body:
            type: string
            children: null
    - id: service
      type: custom
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: http-request
        title: 检索、状态机、模拟订单与工单
        desc: ''
        selected: false
        method: post
        url: '{{#env.MOCK_API_BASE_URL#}}/api/chat/turn'
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type:application/json

          X-API-Key:{{#env.MOCK_API_KEY#}}'
        params: ''
        variables: []
        body:
          type: raw-text
          data:
          - id: body
            key: ''
            type: text
            value: '{{#pack.body#}}'
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 10
        retry_config:
          retry_enabled: true
          max_retries: 2
          retry_interval: 500
        error_strategy: default-value
        default_value:
        - key: body
          type: string
          value: '{}'
        - key: status_code
          type: number
          value: 503
    - id: compose
      type: custom
      position:
        x: 1280
        y: 280
      positionAbsolute:
        x: 1280
        y: 280
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 无模型占位（跳过表达层）
        desc: ''
        selected: false
        code_language: python3
        code: "def main() -> dict:\n    return {\"text\": \"\"}\n"
        variables: []
        outputs:
          text:
            type: string
            children: null
    - id: unpack
      type: custom
      position:
        x: 1580
        y: 280
      positionAbsolute:
        x: 1580
        y: 280
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 响应验证与失败降级
        desc: ''
        selected: false
        code_language: python3
        code: "import json\nimport base64\nimport re\n\n# 表达层的输出由模型生成，属于不可信输入：越界就回落到规则服务的原始文案。\n# 注意「承诺」要区分否定式：说「不能承诺退款」是正确行为，说「我们承诺退款」才是越界。\n\
          # 判否定用单字（不/没/无/否），比逐个列词组稳，也不会随措辞变化而漏判。\nFORBIDDEN = re.compile(\n    r'已派单|已派给|客服(会|将)在|将在\\s*\\d|保证|一定(能|会)'\n\
          \    r'|schema_version|citations|transfer_summary|__EVIDENCE|vision|tasks')\nNEGATION_CHARS = '不没无否别'\n\n\ndef oversteps(text):\n\
          \    if FORBIDDEN.search(text):\n        return True\n    for m in re.finditer(r'承诺\\s*(退款|赔偿|换新)', text):\n   \
          \     window = text[max(0, m.start() - 5):m.start()]\n        if not any(c in window for c in NEGATION_CHARS):\n\
          \            return True\n    return False\n\n\ndef main(body: str, status_code: int, previous_state: str, composed:\
          \ str) -> dict:\n    try:\n        data = json.loads(body)\n        if status_code != 200 or not isinstance(data.get('answer'),\
          \ str) or not isinstance(data.get('state'), dict):\n            raise ValueError('invalid service response')\n \
          \       answer = data['answer']\n        if isinstance(composed, str) and composed.strip() and not oversteps(composed):\n\
          \            answer = composed.strip()\n        evidence = base64.b64encode(json.dumps(data['state'], ensure_ascii=False).encode()).decode()\n\
          \        return {'answer': answer + '\\n__EVIDENCE_V1__' + evidence + '__EVIDENCE_END__', 'state': json.dumps(data['state'],\
          \ ensure_ascii=False)}\n    except Exception:\n        return {'answer': '演示服务暂时不可用，当前未完成订单核验或创建工单，请稍后重试或联系真实客服。',\
          \ 'state': previous_state}\n"
        variables:
        - variable: body
          value_selector:
          - service
          - body
        - variable: status_code
          value_selector:
          - service
          - status_code
        - variable: previous_state
          value_selector:
          - conversation
          - session_state
        - variable: composed
          value_selector:
          - compose
          - text
        outputs:
          answer:
            type: string
            children: null
          state:
            type: string
            children: null
    - id: save
      type: custom
      position:
        x: 1880
        y: 280
      positionAbsolute:
        x: 1880
        y: 280
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: assigner
        title: 保存会话状态
        desc: ''
        selected: false
        version: '2'
        items:
        - variable_selector:
          - conversation
          - session_state
          input_type: variable
          operation: over-write
          value:
          - unpack
          - state
    - id: answer
      type: custom
      position:
        x: 2180
        y: 280
      positionAbsolute:
        x: 2180
        y: 280
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      data:
        type: answer
        title: 原样输出受约束答复
        desc: ''
        selected: false
        answer: '{{#unpack.answer#}}'
        variables: []
    edges:
    - id: start-extract
      type: custom
      source: start
      target: extract
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: start
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: extract-pack
      type: custom
      source: extract
      target: pack
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: code
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: pack-service
      type: custom
      source: pack
      target: service
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: code
        targetType: http-request
        isInIteration: false
        isInLoop: false
    - id: service-compose
      type: custom
      source: service
      target: compose
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: compose-unpack
      type: custom
      source: compose
      target: unpack
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: code
        targetType: code
        isInIteration: false
        isInLoop: false
    - id: unpack-save
      type: custom
      source: unpack
      target: save
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: code
        targetType: assigner
        isInIteration: false
        isInLoop: false
    - id: save-answer
      type: custom
      source: save
      target: answer
      sourceHandle: source
      targetHandle: target
      data:
        sourceType: assigner
        targetType: answer
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 0.65
  rag_pipeline_variables: []
