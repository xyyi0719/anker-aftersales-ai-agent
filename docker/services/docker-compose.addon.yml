# From repository root: docker compose --env-file .env -f docker/services/docker-compose.addon.yml up -d --build
services:
  retrieval:
    build:
      context: ../..
      dockerfile: docker/services/Dockerfile
    restart: unless-stopped
    command: [uvicorn, retrieval.app:app, --host, 0.0.0.0, --port, '8001']
    networks: [internal]
    healthcheck:
      test: [CMD, python, /app/healthcheck.py, '8001']
      interval: 15s
      timeout: 5s
      retries: 5
  mock-apis:
    build:
      context: ../..
      dockerfile: docker/services/Dockerfile
    restart: unless-stopped
    environment:
      RETRIEVAL_URL: http://retrieval:8001
      TICKET_DB: /data/tickets.sqlite3
      MOCK_API_KEY: ${MOCK_API_KEY:-}
    volumes: [tickets:/data]
    depends_on:
      retrieval:
        condition: service_healthy
    networks:
      internal: {}
      dify:
        aliases: [anker-demo-api]
    healthcheck:
      test: [CMD, python, /app/healthcheck.py, '8002']
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  internal: {}
  dify:
    external: true
    name: ${DIFY_NETWORK:-docker_default}
volumes:
  tickets: {}
