# Render __DIFY_API_KEY__ on the server; this file contains no credential.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    # Proxy to Dify's API container over the shared Docker network.
    # Do not use the public domain here: the container cannot reach its own public IP.
    location = /dify-api/chat-messages {
        limit_except POST { deny all; }
        proxy_pass http://api:5001/v1/chat-messages;
        proxy_set_header Authorization "Bearer __DIFY_API_KEY__";
        proxy_set_header Host dify.high33light.cn;
        proxy_read_timeout 130s;
        proxy_buffering off;
    }
    location = /dify-api/files/upload {
        limit_except POST { deny all; }
        proxy_pass http://api:5001/v1/files/upload;
        proxy_set_header Authorization "Bearer __DIFY_API_KEY__";
        proxy_set_header Host dify.high33light.cn;
        proxy_read_timeout 60s;
    }
    location /dify-api/ { return 404; }
    # 转派动作直连 Mock 服务（浏览器同源路径 /mock-api → anker-demo-api:8002）。
    # 注意：若部署时设置了 MOCK_API_KEY，需要在此注入 X-API-Key（否则动作接口返回 401）。
    location /mock-api/ {
        limit_except POST { deny all; }
        proxy_pass http://anker-demo-api:8002/;
        proxy_set_header Host anker-demo-api;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|svg|png|jpg|jpeg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
