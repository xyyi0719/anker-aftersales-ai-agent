# Render __DIFY_API_KEY__ on the server; this file contains no credential.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /dify-api/chat-messages {
        limit_except POST { deny all; }
        proxy_pass https://dify.high33light.cn/v1/chat-messages;
        proxy_set_header Authorization "Bearer __DIFY_API_KEY__";
        proxy_set_header Host dify.high33light.cn;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 130s;
        proxy_buffering off;
    }
    location = /dify-api/files/upload {
        limit_except POST { deny all; }
        proxy_pass https://dify.high33light.cn/v1/files/upload;
        proxy_set_header Authorization "Bearer __DIFY_API_KEY__";
        proxy_set_header Host dify.high33light.cn;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 60s;
    }
    location /dify-api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|svg|png|jpg|jpeg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
